<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Darts Trainer</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{margin:0;padding:12px;background:#0f172a;color:#f8fafc;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.app{width:100%;max-width:680px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;background:#1e293b;padding:12px;border-radius:12px;border:1px solid #334155}
.title{font-size:1.1rem;font-weight:700}
.stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{background:#0f172a;padding:6px 8px;border-radius:8px;font-size:.8rem;font-weight:600;border:1px solid #334155}
.tbox{display:flex;align-items:center;gap:5px;background:#0f172a;padding:4px 8px;border-radius:8px;border:1px solid #334155}
.tdisp{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:center;color:#38bdf8}
.tpaused{color:#f59e0b!important}
.bsm{background:#334155;color:#f8fafc;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600}
.bpact{background:#f59e0b;color:#000}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.tbtn{background:#1e293b;color:#94a3b8;border:1px solid #334155;padding:10px 6px;border-radius:10px;font-weight:600;font-size:.82rem;cursor:pointer;text-align:center}
.tbtn.active{background:#10b981;color:#052e16;border-color:#10b981;font-weight:700}
.fbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.fchip{background:#1e293b;color:#94a3b8;border:1px solid #334155;padding:6px 10px;border-radius:99px;font-size:.78rem;cursor:pointer;white-space:nowrap}
.fchip.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:700}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin-bottom:14px}
.hero{font-size:2.8rem;font-weight:800;text-align:center;margin:8px 0}
.sub{text-align:center;color:#94a3b8;font-size:.9rem;margin-bottom:16px}
.ogrid{display:grid;grid-template-columns:1fr;gap:10px}
.obtn{background:#0f172a;color:#f8fafc;border:2px solid #334155;padding:14px 10px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;text-align:center}
.obtn.correct{background:rgba(16,185,129,.25);border-color:#10b981;color:#34d399}
.obtn.wrong{background:rgba(239,68,68,.25);border-color:#ef4444;color:#f87171}
.fbox{margin-top:14px;padding:12px;border-radius:10px;background:#0f172a;border-left:4px solid #10b981;font-size:.9rem;line-height:1.4;display:none}
.nbtn{width:100%;margin-top:12px;padding:14px;background:#10b981;color:#052e16;border:none;border-radius:10px;font-size:1rem;font-weight:800;cursor:pointer;display:none}
.lrow{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.lnum{width:85px;background:#0f172a;color:#fff;border:2px solid #38bdf8;border-radius:10px;padding:8px;font-size:1.3rem;font-weight:800;text-align:center}
.lsl{flex:1;height:8px}
.ipanel{background:#0f172a;padding:12px;border-radius:10px;border:1px solid #334155;margin-bottom:10px}
.ilbl{font-size:.75rem;text-transform:uppercase;color:#94a3b8}
.ival{font-size:1.25rem;font-weight:800;margin-top:4px;color:#38bdf8}
.ival.alt{color:#f59e0b}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">🎯 Darts Trainer</div>
    <div class="stats">
      <div class="badge">🔥 <span id="stV">0</span></div>
      <div class="badge">✅ <span id="scV">0/0</span></div>
      <div class="tbox">
        <span id="tDisp" class="tdisp">0.0s</span>
        <button id="pBtn" class="bsm" onclick="togP()">⏸️ Pause</button>
        <button class="bsm" onclick="resT()">🔄</button>
        <button id="tBtn" class="bsm" onclick="togTM()">⏱️ Ein</button>
      </div>
    </div>
  </header>
  <div class="tabs">
    <button class="tbtn active" onclick="setM(1)">1. Checkout-Quiz</button>
    <button class="tbtn" onclick="setM(2)">2. Single-Rettung</button>
    <button class="tbtn" onclick="setM(3)">3. Rest-Sprint</button>
    <button class="tbtn" onclick="setM(4)">4. Rechner 40-170</button>
  </div>
  <div id="fBar" class="fbar">
    <button class="fchip active" onclick="setF('all',this)">Alle 40-170</button>
    <button class="fchip" onclick="setF('61-100',this)">61-100 (2-Dart)</button>
    <button class="fchip" onclick="setF('101-130',this)">101-130 (Bull)</button>
    <button class="fchip" onclick="setF('131-170',this)">131-170 (High)</button>
    <button class="fchip" onclick="setF('40-60',this)">40-60 (Single)</button>
  </div>
  <div id="qView" class="card">
    <div id="qTag" style="text-align:center;font-size:.78rem;color:#38bdf8;font-weight:700">STANDARD CHECKOUT</div>
    <div id="hScore" class="hero">89 Rest</div>
    <div id="sPrompt" class="sub">Welcher Standard-Weg ist optimal?</div>
    <div id="oCont" class="ogrid"></div>
    <div id="fBox" class="fbox"></div>
    <button id="nBtn" class="nbtn" onclick="nextQ()">Nächste Aufgabe ➡️</button>
  </div>
  <div id="lView" class="card" style="display:none">
    <div class="lrow">
      <input type="number" id="lNum" class="lnum" min="40" max="170" value="104" oninput="updL(this.value)">
      <input type="range" id="lSl" class="lsl" min="40" max="170" value="104" oninput="updL(this.value)">
    </div>
    <div class="ipanel">
      <div class="ilbl">Standard-Weg (1. Dart Triple/Bull)</div>
      <div id="lkStd" class="ival"></div>
    </div>
    <div class="ipanel">
      <div class="ilbl">1. Dart nur Single (Umbau-Weg)</div>
      <div id="lkAlt" class="ival alt"></div>
    </div>
    <div class="ipanel">
      <div class="ilbl">Board-Strategie</div>
      <div id="lkTip" style="margin-top:6px;font-size:.92rem"></div>
    </div>
  </div>
</div>
